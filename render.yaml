services:
  - type: web
    name: mediastance-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements_api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_DATASET_REPO
        value: JhanviN/mediastance-db
      - key: HF_MODEL_REPO
        value: JhanviN/mediastance-deploy
      - key: SYNC_INTERVAL_MINUTES
        value: "30"
      - key: PIPELINE_INTERVAL_MINUTES
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.0"
