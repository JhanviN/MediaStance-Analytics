name: Update Predictions Daily

on:
  schedule:
    # Runs at 6 AM UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_hf.txt') }}

      - name: Install dependencies
        run: pip install -r requirements_hf.txt

      - name: Download model from HF Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='JhanviN/mediastance-deploy',
              local_dir='models/transformer_bilateral',
              token='${{ secrets.HF_TOKEN }}'
          )
          print('Model downloaded')
          "

      - name: Run live pipeline
        run: python scripts/live_pipeline.py --once --model baseline

      - name: Commit updated predictions DB
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/predictions.db
          git diff --staged --quiet || git commit -m "chore: update predictions [$(date -u '+%Y-%m-%d')]"
          git push
