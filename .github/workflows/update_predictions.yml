name: Update Predictions Daily

on:
  schedule:
    # Runs at 6 AM UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_hf.txt') }}

      - name: Install dependencies
        run: pip install -r requirements_hf.txt

      - name: Download model from HF Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='JhanviN/mediastance-deploy',
              local_dir='models/transformer_bilateral',
              token=os.environ['HF_TOKEN'],
          )
          print('Model downloaded')
          EOF

      - name: Download latest predictions DB from HF Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os, shutil
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id='JhanviN/mediastance-db',
              repo_type='dataset',
              filename='predictions.db',
              token=os.environ['HF_TOKEN'],
          )
          shutil.copy(path, 'data/predictions.db')
          import sqlite3
          n = sqlite3.connect('data/predictions.db').execute('SELECT COUNT(*) FROM predictions').fetchone()[0]
          print(f'DB downloaded — {n} existing predictions')
          EOF

      - name: Run live pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/live_pipeline.py --once --model both

      - name: Upload updated predictions DB to HF Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os, sqlite3
          from huggingface_hub import HfApi
          n = sqlite3.connect('data/predictions.db').execute('SELECT COUNT(*) FROM predictions').fetchone()[0]
          print(f'Uploading DB with {n} predictions...')
          HfApi(token=os.environ['HF_TOKEN']).upload_file(
              path_or_fileobj='data/predictions.db',
              path_in_repo='predictions.db',
              repo_id='JhanviN/mediastance-db',
              repo_type='dataset',
              commit_message=f'chore: daily update — {n} predictions',
          )
          print('Upload complete')
          EOF
